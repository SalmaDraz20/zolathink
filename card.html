<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>كارت القرار — Zola Think</title>
<style>
  :root{--bg:#f7f5fb;--card:#fff;--ink:#1d1a26;--mute:#6b6678;--brand:#5b3fd1;--brand-d:#4630a8;--line:#ddd8ea;--ok:#1d7a4d;--err:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#15121d;--card:#1f1b2b;--ink:#f1eefa;--mute:#a8a2ba;--line:#363048;--brand:#8f78ff;--brand-d:#a897ff;--ok:#5fd29a;--err:#ff8a80}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.7}
  main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
  header h1{font-size:1.35rem;margin:0 0 4px}
  header p{margin:0;color:var(--mute);font-size:.95rem}
  .badge{display:inline-block;background:var(--brand);color:#fff;border-radius:999px;padding:2px 12px;font-size:.85rem;margin-inline-end:6px}
  form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
  label{display:block;font-weight:600;margin:16px 0 6px}
  label small{font-weight:400;color:var(--mute);display:block}
  input,textarea,select{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  textarea{min-height:92px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px}
  button{margin-top:22px;width:100%;font:inherit;font-weight:700;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px;cursor:pointer}
  button:hover{background:var(--brand-d)}
  button:disabled{opacity:.6;cursor:default}
  .note{font-size:.85rem;color:var(--mute);margin-top:14px}
  .msg{margin-top:14px;padding:12px;border-radius:10px;display:none}
  .msg.ok{display:block;background:rgba(29,122,77,.12);color:var(--ok)}
  .msg.err{display:block;background:rgba(179,38,30,.12);color:var(--err)}
  .after-only{display:none}
  body[data-phase="after"] .after-only{display:block}
</style>
</head>
<body data-phase="before">
<main>
  <header>
    <h1>كارت القرار</h1>
    <p><span class="badge" id="phaseBadge">قبل</span><span id="missionLabel"></span></p>
    <p style="margin-top:8px">اكتب بكلامك أنت لوحدك. مفيش إجابة غلط، المهم تقول ليه.</p>
  </header>

  <form id="f" novalidate>
    <div id="phasePick" style="display:none">
      <label for="phase">المرحلة</label>
      <select id="phase"><option value="before">قبل الشغل مع الفريق</option><option value="after">بعد الشغل مع الفريق</option></select>
    </div>

    <label for="code">كودك <small>الكود اللي الميسّر إداهولك. ماتكتبش اسمك.</small></label>
    <input id="code" name="code" autocomplete="off" required maxlength="20" inputmode="text">

    <label for="q1">١. أول حل هتختاره <small>قول الحل في جملة أو اتنين.</small></label>
    <textarea id="q1" name="q1" required maxlength="1000"></textarea>

    <label for="q2">٢. ليه اخترته؟</label>
    <textarea id="q2" name="q2" required maxlength="1000"></textarea>

    <label for="q3">٣. إيه أهم قيد أو شرط في المشكلة؟</label>
    <textarea id="q3" name="q3" maxlength="1000"></textarea>

    <label for="q4">٤. إيه حاجة اتعلمتها قبل كده واستخدمتها هنا؟ <small>سمّيها باسمها، وقول استخدمتها فين.</small></label>
    <textarea id="q4" name="q4" maxlength="1000"></textarea>

    <label for="q5">٥. إيه حل تاني كان ممكن تختاره؟ وإيه اللي تنازلت عنه؟</label>
    <textarea id="q5" name="q5" maxlength="1000"></textarea>

    <label for="q6">٦. إزاي هتعرف إن الحل نجح؟</label>
    <textarea id="q6" name="q6" maxlength="1000"></textarea>

    <div class="after-only">
      <label for="q7">٧. إيه اللي غيّرته من حلك الأول؟ وليه؟ <small>لو ما غيّرتش حاجة، قول ليه.</small></label>
      <textarea id="q7" name="q7" maxlength="1000"></textarea>
    </div>

    <button type="submit" id="send">إرسال</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <p class="note">إجاباتك بتتسجّل بالكود بس، من غير اسمك. استخدم نفس الكود في «قبل» و«بعد».</p>
  </form>
</main>

<script>
// ===== إعدادات: بدّل القيمتين دول بعد ما تنشري Google Apps Script =====
const ENDPOINT = 'PASTE_APPS_SCRIPT_URL_HERE';
// ======================================================================

const q = new URLSearchParams(location.search);
const mission = (q.get('mission') || '').replace(/[^\w؀-ۿ -]/g,'').slice(0,20);
const key = q.get('k') || '';
let phase = q.get('phase') === 'after' ? 'after' : (q.get('phase') === 'before' ? 'before' : '');
const $ = id => document.getElementById(id);

function applyPhase(p){
  document.body.dataset.phase = p;
  $('phaseBadge').textContent = p === 'after' ? 'بعد' : 'قبل';
}
if (!phase){ $('phasePick').style.display='block'; phase='before'; $('phase').addEventListener('change',e=>{phase=e.target.value;applyPhase(phase)}); }
applyPhase(phase);
if (mission) $('missionLabel').textContent = 'Mission ' + mission;

// حفظ مسودة مؤقتة لو الصفحة اتقفلت بالغلط
const DRAFT = 'zola-draft-' + (mission||'x') + '-' + phase;
const fields = ['code','q1','q2','q3','q4','q5','q6','q7'];
try{
  const d = JSON.parse(sessionStorage.getItem(DRAFT)||'{}');
  fields.forEach(k=>{ if(d[k]) $(k).value = d[k]; });
}catch(e){}
$('f').addEventListener('input',()=>{
  try{ const d={}; fields.forEach(k=>d[k]=$(k).value); sessionStorage.setItem(DRAFT,JSON.stringify(d)); }catch(e){}
});

function show(type,text){ const m=$('msg'); m.className='msg '+type; m.textContent=text; }

$('f').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const code = $('code').value.trim();
  if(!code || !$('q1').value.trim() || !$('q2').value.trim()){
    show('err','اكتب الكود وأول حل وليه اخترته على الأقل.'); return;
  }
  if(ENDPOINT.startsWith('PASTE_')){ show('err','الموقع لسه مش متوصّل بالشيت. كلّم الميسّر.'); return; }
  const btn=$('send'); btn.disabled=true; show('ok','جاري الإرسال…');
  const body = new URLSearchParams({ k:key, mission, phase, code });
  fields.slice(1).forEach(k=>body.set(k,$(k).value.trim()));
  try{
    await fetch(ENDPOINT,{method:'POST',mode:'no-cors',body});
    show('ok','اتسجّلت إجابتك. شكرًا!');
    try{ sessionStorage.removeItem(DRAFT); }catch(e){}
    btn.textContent='اتبعت';
  }catch(err){
    btn.disabled=false;
    show('err','الإرسال مانفعش. اتأكد من النت وجرّب تاني. إجابتك لسه محفوظة.');
  }
});
</script>
</body>
</html>
