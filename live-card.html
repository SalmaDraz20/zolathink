<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>كارت — Zola Think</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#111535;--ink2:#19203a;--muted:#626782;--purple:#6724cc;--purple2:#6739a6;--lav:#f5efff;--lav2:#ece3fb;--line:#eadff8;--note:#ece6fb;--ok:#1d7a4d;--err:#b3261e;--shadow:0 9px 27px #493b7312}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#fff}
  body{margin:0;min-height:100dvh;color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6;background:#fff;overflow-x:hidden}
  .shell{max-width:520px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 12px}
  .top img{height:30px;width:auto}
  .pill{font-size:13px;font-weight:600;color:var(--purple2);background:var(--lav);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
  .bar{height:6px;background:var(--lav2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--purple);border-radius:99px;transition:width .35s ease}
  .count{font-size:12px;color:var(--muted);margin:6px 2px 0;min-height:18px}
  .stage{flex:1;display:flex;align-items:center;padding:18px 0}
  .card{width:100%;background:#fff;border:1px solid #f0edf5;border-radius:22px;box-shadow:var(--shadow);padding:26px 20px 22px;animation:pop .35s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  h1{font-size:clamp(22px,6vw,28px);line-height:1.5;margin:0 0 10px;font-weight:700;color:var(--ink)}
  .note{display:inline-block;background:var(--note);color:var(--purple2);font-size:14px;font-weight:500;padding:8px 14px;border-radius:8px;margin:0 0 16px}
  .field{width:100%;font:inherit;font-size:19px;color:var(--ink);background:#fcfaff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-height:58px}
  textarea.field{min-height:110px;resize:vertical}
  .field:focus{outline:0;border-color:var(--purple);box-shadow:0 0 0 4px #6724cc1f}
  .grid{display:grid;grid-template-columns:1fr;gap:10px}
  .chip{font:inherit;font-size:17px;font-weight:500;color:var(--ink2);background:#fff;border:2px solid var(--line);border-radius:16px;min-height:56px;padding:10px 12px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
  .emo{display:flex;gap:8px}.emo .chip{flex:1;display:flex;flex-direction:column;align-items:center;min-height:84px;padding:8px 2px;font-size:12px}
  .emo .e{font-size:30px}
  .nav{display:flex;gap:10px}
  .btn{font:inherit;font-size:17px;font-weight:700;border-radius:16px;min-height:56px;padding:0 22px;cursor:pointer;border:2px solid transparent}
  .btn.primary{flex:1;background:var(--purple);color:#fff}
  .btn.ghost{background:#fff;color:var(--purple2);border-color:var(--line)}
  .btn:disabled{opacity:.45;cursor:default}
  .err{color:var(--err);font-size:14px;margin-top:10px;min-height:20px}
  .center{text-align:center;padding:10px 4px}
  .center p{color:var(--muted);margin:4px 0 0}
  .tick{font-size:56px}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <img src="assets/zola-wordmark.png" alt="Zola Think" onerror="this.style.display='none'">
    <span class="pill" id="pill"></span>
  </header>
  <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
  <div class="count" id="count"></div>
  <section class="stage"><div id="stage" style="width:100%" aria-live="polite"></div></section>
  <footer class="nav" id="nav" hidden>
    <button class="btn ghost" id="back" type="button">رجوع</button>
    <button class="btn primary" id="next" type="button">التالي</button>
  </footer>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EMO = [['😕','مش واثق'],['🤔','شوية'],['🙂','معقول'],['😀','واثق'],['🤩','واثق جدًا']];
const qs = new URLSearchParams(location.search);
const preset = (qs.get('c') || '').replace(/[^\w-]/g, '').toUpperCase().slice(0, 20);
let card = null, steps = [], A = {}, idx = 0, sending = false, started = Date.now(), DRAFT = '';

function show(html){ $('stage').innerHTML = '<div class="card">' + html + '</div>'; }
function msg(icon, title, text){ $('nav').hidden = true; $('barfill').style.width = '0'; $('count').textContent = ''; show(`<div class="center"><div class="tick">${icon}</div><h1>${title}</h1><p>${esc(text)}</p></div>`); }

async function load(){
  try {
    const r = await fetch('/api/card', {cache:'no-store'});
    const d = await r.json();
    if (!d.ok) return msg('⚠️', 'مش قادرين نفتح الكارت', d.message || 'جرّب تاني بعد لحظة.');
    if (!d.card) return msg('⏳', 'مفيش كارت مفتوح دلوقتي', 'استنّي المدرّبة تفتحه. الصفحة بتتحدّث لوحدها.'), setTimeout(load, 8000);
    card = d.card; DRAFT = 'zola-live-' + card.id;
    $('pill').textContent = (card.phase === 'after' ? 'بعد' : 'قبل') + (card.mission != null ? ' · Mission ' + card.mission : '');
    steps = [{id:'code', type:'code', text:'كودك إيه؟', note:'الكود اللي المدرّبة إدّتهولك. ماتكتبش اسمك.'}, ...card.questions.map((q,i)=>({...q, intro: i===0 ? card.intro : ''}))];
    try { const s = JSON.parse(sessionStorage.getItem(DRAFT) || 'null'); if (s) { A = s.A || {}; idx = Math.min(s.idx || 0, steps.length - 1); started = s.t || started; } } catch(e){}
    if (preset && !A.code) A.code = preset;
    $('nav').hidden = false; render();
  } catch(e) { msg('⚠️', 'مفيش اتصال', 'اتأكد من النت وجرّب تاني.'); }
}
const save = () => { try { sessionStorage.setItem(DRAFT, JSON.stringify({A, idx, t: started})); } catch(e){} };
const valid = s => { const v = A[s.id]; if (s.type==='multi') return Array.isArray(v) && v.length>0; if (s.type==='scale') return Number.isInteger(v); return typeof v==='string' && v.trim().length>0; };

function render(){
  const s = steps[idx], last = idx === steps.length - 1;
  $('barfill').style.width = ((idx+1)/steps.length*100) + '%';
  $('count').textContent = (idx+1) + ' / ' + steps.length;
  $('back').style.visibility = idx === 0 ? 'hidden' : 'visible';
  $('next').textContent = last ? 'إرسال ✨' : 'التالي';
  $('next').disabled = sending || !valid(s);
  let body = '';
  if (s.type === 'code') body = `<input class="field" id="in" autocomplete="off" maxlength="20" placeholder="مثال: 365" value="${esc(A.code||'')}">`;
  else if (s.type === 'text') body = `<textarea class="field" id="in" maxlength="300" placeholder="اكتب هنا">${esc(A[s.id]||'')}</textarea>`;
  else if (s.type === 'single' || s.type === 'multi') {
    const sel = A[s.id] || (s.type==='multi' ? [] : '');
    body = '<div class="grid">' + s.choices.map(c => `<button type="button" class="chip" data-v="${esc(c)}" aria-pressed="${s.type==='multi' ? sel.includes(c) : sel===c}">${esc(c)}</button>`).join('') + '</div>';
  } else if (s.type === 'scale') body = '<div class="emo">' + EMO.map(([e,t],i)=>`<button type="button" class="chip" data-v="${i+1}" aria-pressed="${A[s.id]===i+1}"><span class="e">${e}</span>${t}</button>`).join('') + '</div>';
  show(`<h1>${esc(s.text)}</h1>${s.note?`<div class="note">${esc(s.note)}</div>`:''}${s.intro?`<div class="note">${esc(s.intro)}</div>`:''}${body}<div class="err" id="err" role="alert"></div>`);
  const inp = $('in');
  if (inp) {
    inp.addEventListener('input', () => { A[s.id==='code'?'code':s.id] = inp.value; save(); $('next').disabled = !valid(s); });
    setTimeout(() => inp.focus({preventScroll:true}), 100);
  }
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.v;
    if (s.type === 'multi') { const a = new Set(A[s.id]||[]); a.has(v) ? a.delete(v) : a.add(v); A[s.id] = [...a]; b.setAttribute('aria-pressed', a.has(v)); }
    else { A[s.id] = s.type==='scale' ? +v : v; document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.v===v)); }
    save(); $('next').disabled = !valid(s);
  }));
}
function go(d){
  if (sending) return;
  if (d > 0 && !valid(steps[idx])) { $('err').textContent = 'جاوب الأول'; return; }
  if (d > 0 && idx === steps.length - 1) return submit();
  idx = Math.max(0, Math.min(steps.length-1, idx+d)); save(); render(); window.scrollTo({top:0,behavior:'smooth'});
}
$('next').addEventListener('click', () => go(1));
$('back').addEventListener('click', () => go(-1));

async function submit(){
  sending = true; $('next').disabled = true; $('next').textContent = 'جاري الإرسال…';
  try {
    const r = await fetch('/api/card-submit', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({cardId: card.id, code: (A.code||'').trim(), seconds: Math.round((Date.now()-started)/1000),
        answers: steps.slice(1).map(s => A[s.id])})});
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) { try { sessionStorage.removeItem(DRAFT); } catch(e){} return msg('✅', 'اتسجّلت إجابتك', card.phase === 'before' ? 'كمّل مع فريقك. هنرجعلك بعد الشغل.' : 'شكرًا! خلصت.'); }
    if (d.code === 'duplicate') return msg('✅', 'إجابتك اتسجّلت', 'شكرًا! مش محتاج تبعت تاني.');
    if (d.code === 'closed') return msg('🔒', 'الكارت اتقفل', 'كلّم المدرّبة.');
    sending = false; render(); $('err').textContent = d.message || 'مقدرناش نبعت. جرّب تاني.';
  } catch(e) { sending = false; render(); $('err').textContent = 'مفيش اتصال. جرّب تاني.'; }
}
load();
</script>
</body>
</html>
